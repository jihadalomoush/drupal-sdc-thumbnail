# Publishes drupal-sdc-thumbnail to npmjs when a GitHub Release is
# published (or when run manually from the Actions tab).
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN needed; the configured
# GitHub Actions trusted publisher on npmjs authorizes the publish.
# https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # tests don't need a browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # No registry-url: it writes an .npmrc placeholder _authToken that shadows
      # OIDC trusted publishing on current npm. npm defaults to the npmjs
      # registry, and OIDC provides the credential.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5 (npm 12 needs node >= 22)
      - run: node -v && npm -v # diagnostic: confirm npm >= 11.5 so OIDC engages
      - run: npm ci
      - run: npm publish --access public
