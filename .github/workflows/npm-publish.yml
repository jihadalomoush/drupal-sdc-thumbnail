# Publishes drupal-sdc-thumbnail to npmjs when a GitHub Release is
# published (or when run manually from the Actions tab).
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN needed; the configured
# GitHub Actions trusted publisher on npmjs authorizes the publish.
# https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # tests don't need a browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish --access public
        env:
          # NPM_TOKEN must be an Automation (or Granular read+write) token so it
          # publishes non-interactively past account 2FA.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
